<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Role Table</title>
    <!-- Adding Tailwind CDN so the classes actually work -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Zebra Striping to match your header */
        .zebra-table tbody tr:nth-child(even) {
            background-color: #F8F4FF;
        }
        
    </style>
</head>
<body class="p-10 bg-gray-50">

    <div class="max-w-5xl mx-auto overflow-hidden rounded-xl border border-gray-200 shadow-sm bg-white">
        <table class="w-full text-left border-collapse zebra-table">
            <!-- Header: Matching your image_a0bf7a.png -->
            <thead class="bg-[#F8F4FF] border-b border-purple-100">
                <tr>
                    <th class="px-6 py-4 text-sm font-bold uppercase tracking-wider text-purple-700">Actions</th>
                    <th class="px-6 py-4 text-sm font-bold uppercase tracking-wider text-purple-700">Role Name</th>
                    <th class="px-6 py-4 text-sm font-bold uppercase tracking-wider text-purple-700">Role Description</th>
                    <th class="px-6 py-4 text-sm font-bold uppercase tracking-wider text-purple-700">Status</th>
                </tr>
            </thead>
            
            <tbody class="divide-y divide-gray-100">
                <!-- Row 1 -->
                <tr class="hover:bg-[#F0EBFF] transition-colors group">
                    <td class="px-6 py-4 space-x-2">
                        <button class="text-blue-500 hover:text-blue-700">👁️</button>
                        <button class="text-orange-400 hover:text-orange-600">✏️</button>
                        <button class="text-red-500 hover:text-red-700">🗑️</button>
                    </td>
                    <td class="px-6 py-4 font-semibold text-gray-800">ADMIN</td>
                    <td class="px-6 py-4 text-gray-600 italic">Full system control</td>
                    <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Active</span>
                    </td>
                </tr>
                
                <!-- Row 2 -->
                <tr class="hover:bg-[#F0EBFF] transition-colors group">
                    <td class="px-6 py-4 space-x-2">
                        <button class="text-blue-500 hover:text-blue-700">👁️</button>
                        <button class="text-orange-400 hover:text-orange-600">✏️</button>
                        <button class="text-red-500 hover:text-red-700">🗑️</button>
                    </td>
                    <td class="px-6 py-4 font-semibold text-gray-800">MANAGER</td>
                    <td class="px-6 py-4 text-gray-600 italic">Team management access</td>
                    <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Active</span>
                    </td>
                </tr>

                <!-- Row 3 -->
                <tr class="hover:bg-[#F0EBFF] transition-colors group">
                    <td class="px-6 py-4 space-x-2">
                        <button class="text-blue-500 hover:text-blue-700">👁️</button>
                        <button class="text-orange-400 hover:text-orange-600">✏️</button>
                        <button class="text-red-500 hover:text-red-700">🗑️</button>
                    </td>
                    <td class="px-6 py-4 font-semibold text-gray-800">FINANCE</td>
                    <td class="px-6 py-4 text-gray-600 italic">Billing and reports</td>
                    <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Active</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
