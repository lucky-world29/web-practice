<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Testimonial Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Lato:wght@700&family=Noticia+Text:wght@400&display=swap");

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background: hsl(250, 85%, 97%);
            perspective: 500px;
            font-family: "Lato", sans-serif;
        }

        article {
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: hsl(0, 0%, 100%);
            line-height: 2;
            border-radius: 10px;
            margin: 0.5rem;
            transition: transform 0.2s ease-out;
            box-shadow: 0 5px 20px -2px hsla(0, 0%, 0%, 0.1);
        }

        article figure {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-top: -60px;
            position: relative;
        }

        article figure::before {
            content: "";
            border-radius: inherit;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            border: 1rem solid hsl(250, 85%, 97%);
            box-shadow: 0 1px hsla(0, 0%, 0%, 0.1);
        }

        article figure img {
            border-radius: inherit;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        article div {
            text-align: center;
            margin: 2rem;
        }

        article div p {
            margin: 1rem 0 3rem;
            font-family: "Noticia Text", serif;
            position: relative;
            z-index: 5;
        }

        article div p::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            z-index: -5;
            opacity: 0.05;

            background:
                url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70">\
                <rect x="0" y="0" width="30" height="30" rx="2" fill="black"/>\
                <path d="M 0 40 q 0 -40 30 -40 v 15 q -15 0 -15 25" fill="black"/>\
                <rect x="40" y="0" width="30" height="30" rx="2" fill="black"/>\
                <path d="M 40 40 q 0 -40 30 -40 v 15 q -15 0 -15 25" fill="black"/>\
                </svg>')
                    left top / 3rem no-repeat,

                url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70">\
                <rect x="0" y="0" width="30" height="30" rx="2" fill="black"/>\
                <path d="M 0 40 q 0 -40 30 -40 v 15 q -15 0 -15 25" fill="black"/>\
                <rect x="40" y="0" width="30" height="30" rx="2" fill="black"/>\
                <path d="M 40 40 q 0 -40 30 -40 v 15 q -15 0 -15 25" fill="black"/>\
                </svg>')
                    right bottom / 3rem no-repeat;

            transform: translate(-50%, -50%) rotate(180deg);
        }

        article div h1 {
            color: hsl(250, 50%, 40%);
            font-size: 1.4rem;
        }
            /* For Button  */

            :root {
  --backgroundColor: rgba(246, 241, 209);
  --colorShadeA: rgb(106, 163, 137);
  --colorShadeB: rgb(121, 186, 156);
  --colorShadeC: rgb(150, 232, 195);
  --colorShadeD: rgb(187, 232, 211);
  --colorShadeE: rgb(205, 255, 232);
}

@import url("https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700");
* {
  box-sizing: border-box;
}
*::before,
*::after {
  box-sizing: border-box;
}
body {
  font-family: "OpenSans", sans-serif;
  font-size: 1rem;
  line-height: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  min-height: 100vh;
  background: var(--backgroundColor);
}
button {
  position: relative;
  display: inline-block;
  cursor: pointer;
  outline: none;
  border: 0;
  vertical-align: middle;
  text-decoration: none;
  font-size: 1.5rem;
  color: var(--colorShadeA);
  font-weight: 700;
  text-transform: uppercase;
  font-family: inherit;
}

button.big-button {
  padding: 1em 2em;
  border: 2px solid var(--colorShadeA);
  border-radius: 1em;
  background: var(--colorShadeE);
  transform-style: preserve-3d;
  transition: all 175ms cubic-bezier(0, 0, 1, 1);
}
button.big-button::before {
  position: absolute;
  content: "";
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--colorShadeC);
  border-radius: inherit;
  box-shadow: 0 0 0 2px var(--colorShadeB), 0 0.75em 0 0 var(--colorShadeA);
  transform: translate3d(0, 0.75em, -1em);
  transition: all 175ms cubic-bezier(0, 0, 1, 1);
}

button.big-button:hover {
  background: var(--colorShadeD);
  transform: translate(0, 0.375em);
}

button.big-button:hover::before {
  transform: translate3d(0, 0.75em, -1em);
}

button.big-button:active {
  transform: translate(0em, 0.75em);
}

button.big-button:active::before {
  transform: translate3d(0, 0, -1em);

  box-shadow: 0 0 0 2px var(--colorShadeB), 0 0.25em 0 0 var(--colorShadeB);
}

    </style>
</head>

<body>

    <!-- markup structure -->
    <!-- article, wrapping container -->
    <!-- figure, wrapping the image -->
    <!-- div, wrapping container for a quote -->
    <!-- and the name of the testimonial -->

    <article>
        <figure>
            <img
                alt="A rather marvellous macaw, opening one of its wings to support the cause."
                src="https://images.pexels.com/photos/2317904/pexels-photo-2317904.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940"
            />
        </figure>

        <div>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Corrupti repellat, consequuntur doloribus voluptate esse iure?
            </p>

            <h1>Marvellous Macaw</h1>
        </div>
        <button class="big-button">push</button>
    </article>
    <button class="big-button">push</button>

    <script>
        const article = document.querySelector("article");

        // compute center of card
        const {
            x,
            y,
            width,
            height
        } = article.getBoundingClientRect();

        const cx = x + width / 2;
        const cy = y + height / 2;

        // mouse move effect
        function handleMove(e) {
            const { pageX, pageY } = e;

            // relative distance in range [-1, 1]
            const dx = (cx - pageX) / (width / 2);
            const dy = (cy - pageY) / (height / 2);

            // rotate card
            this.style.transform =
                `rotateX(${10 * dy * -1}deg) rotateY(${10 * dx}deg)`;
        }

        // reset transform
        function handleOut() {
            this.style.transform = "initial";
        }

        article.addEventListener("mousemove", handleMove);
        article.addEventListener("mouseout", handleOut);
    </script>

</body>
</html>
